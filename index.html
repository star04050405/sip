<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>sip. 今天喝的每一杯</title>
<meta name="theme-color" content="#FFF8F0">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  background:#FFF8F0;color:#5A4636;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  min-height:100vh;
  background:linear-gradient(180deg,#FFF9F2 0%,#FFF3E6 60%,#FCEAD9 100%) fixed;
}
.wrap{max-width:520px;margin:0 auto;padding:0 18px 80px}
.hero{padding:38px 0 4px;text-align:center}
.hero .en{font-family:Georgia,serif;font-style:italic;font-size:13px;letter-spacing:.42em;color:#C9A882;text-transform:uppercase}
.hero h1{font-size:32px;font-weight:900;margin-top:8px;color:#7A5A3C;letter-spacing:.04em}
.hero h1 em{font-style:normal;color:#D98A7E}
.hero .sub{margin-top:7px;font-size:13px;color:#B08D6E}
/* today hero */
.today{margin-top:22px;background:#fff;border-radius:24px;padding:20px 18px;text-align:center;box-shadow:0 8px 24px rgba(201,136,80,.1);border:1.5px solid #F5E3CE}
.today .td{font-size:12.5px;color:#B08D6E;font-weight:800;letter-spacing:.14em}
.today .num{font-size:62px;font-weight:900;color:#7A5A3C;line-height:1.15;font-variant-numeric:tabular-nums}
.today .num small{font-size:16px;font-weight:800;color:#C9A882;margin-left:4px}
.today .cap{font-size:12.5px;color:#B08D6E;line-height:1.7}
.today .cap b{color:#D98A7E}
/* drink wall */
.card{background:#fff;border-radius:22px;padding:16px;margin-top:16px;border:1.5px solid #F5E3CE;box-shadow:0 6px 18px rgba(201,136,80,.08)}
.card h2{font-size:12.5px;letter-spacing:.22em;color:#D98A7E;font-weight:900;display:flex;align-items:center;gap:8px}
.card h2:after{content:'';flex:1;height:1px;background:linear-gradient(90deg,#F5E3CE,transparent)}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.dbtn{border:2px solid #F5E9D8;background:#FFFBF5;border-radius:16px;padding:11px 4px 8px;text-align:center;cursor:pointer;transition:.15s}
.dbtn:active{transform:scale(.9)}
.dbtn .de{font-size:26px;line-height:1.2}
.dbtn .dn{font-size:11px;font-weight:800;color:#9A7E5E;margin-top:3px}
.dbtn.hot{border-color:#E8B08A;background:#FFF4E8}
/* custom */
.crow{display:flex;gap:8px;margin-top:12px}
.crow input{
  flex:1;min-width:0;background:#FFFBF5;border:2px solid #F0DFC8;border-radius:14px;
  padding:12px 14px;font-size:16px;font-weight:700;color:#5A4636;outline:none;
}
.crow input:focus{border-color:#E8B08A;box-shadow:0 0 0 3px rgba(232,176,138,.15)}
.crow input::placeholder{color:#CBB89E;font-weight:600}
.cadd{flex:none;border:0;background:linear-gradient(135deg,#E8A87E,#D98A5E);color:#fff;font-weight:900;font-size:14px;border-radius:14px;padding:0 18px;cursor:pointer;font-family:inherit;letter-spacing:.03em}
.cadd:active{transform:scale(.95)}
/* note sheet */
.ovl{position:fixed;inset:0;z-index:100;background:rgba(90,70,54,.4);display:none;align-items:flex-end;justify-content:center}
.ovl.open{display:flex}
.sheet{width:100%;max-width:520px;background:#fff;border-radius:24px 24px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));animation:up .35s cubic-bezier(.2,1,.3,1)}
@keyframes up{from{transform:translateY(50%)}to{transform:none}}
.sheet h3{font-size:15.5px;font-weight:900;color:#7A5A3C;text-align:center}
.sheet .se{font-size:44px;text-align:center;margin-top:6px}
.sheet .sub2{font-size:12px;color:#B08D6E;text-align:center;margin-top:2px;font-weight:700}
.sheet input{
  width:100%;margin-top:14px;background:#FFFBF5;border:2px solid #F0DFC8;border-radius:14px;
  padding:13px 14px;font-size:16px;font-weight:700;color:#5A4636;outline:none;
}
.sheet input:focus{border-color:#E8B08A}
.sbtns{display:flex;gap:9px;margin-top:14px}
.sbtns .b1{flex:1;border:2px solid #F0D9CC;background:#fff;color:#C98A7E;border-radius:14px;padding:12px 0;font-weight:900;font-size:14px;cursor:pointer;font-family:inherit}
.sbtns .b2{flex:2;border:0;background:linear-gradient(135deg,#E8A87E,#D98A5E);color:#fff;border-radius:14px;padding:12px 0;font-weight:900;font-size:14.5px;cursor:pointer;font-family:inherit}
.sbtns .b2:active,.sbtns .b1:active{transform:scale(.97)}
.danger{border:2px solid #F0D9CC;background:#fff;color:#C96A5E;border-radius:14px;padding:12px 0;font-weight:900;font-size:14px;cursor:pointer;font-family:inherit;width:100%;margin-top:9px}
.danger:active{transform:scale(.97)}
/* timeline */
.tl{margin-top:4px}
.trow{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1.5px solid #F7EEDF;cursor:pointer}
.trow:last-child{border-bottom:0}
.trow:active{background:#FFFBF5}
.trow .te{font-size:24px;flex:none}
.trow .tt{flex:1;min-width:0}
.trow .tn{font-size:14.5px;font-weight:800;color:#5A4636}
.trow .tm{font-size:12px;color:#B08D6E;margin-top:2px}
.trow .thw{font-size:11.5px;color:#C9A882;font-weight:800;flex:none;font-variant-numeric:tabular-nums}
.empty{padding:22px 0;text-align:center;font-size:13px;color:#CBB89E;font-weight:700;letter-spacing:.06em;line-height:2}
/* stats */
.stats{display:flex;gap:10px;margin-top:16px}
.stats>div{flex:1;background:#fff;border-radius:18px;padding:14px 8px;text-align:center;border:1.5px solid #F5E3CE}
.stats .n{font-size:23px;font-weight:900;color:#D98A7E;font-variant-numeric:tabular-nums}
.stats .l{font-size:10.5px;color:#B08D6E;margin-top:3px;font-weight:800;letter-spacing:.08em}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.cal .ch{text-align:center;font-size:10.5px;color:#C9A882;font-weight:900;padding:3px 0}
.cal .cd{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;font-size:12px;font-weight:800;color:#9A7E5E;background:#FFFBF5;border:1.5px solid #F7EEDF}
.cal .cd.pad{opacity:0;pointer-events:none}
.cal .cd b{font-size:13.5px;color:#5A4636}
.cal .cd .dots{display:flex;gap:2px;margin-top:2px;height:5px}
.cal .cd .dots i{width:5px;height:5px;border-radius:50%;background:#D98A5E}
.cal .cd.today{border-color:#E8A87E;background:#FFF4E8}
.cal .cd.has b{color:#D98A5E}
.calhead{display:flex;align-items:center;margin-top:14px}
.calhead .cm{font-size:14px;font-weight:900;color:#7A5A3C;flex:1;text-align:center}
.calhead button{width:34px;height:34px;border:1.5px solid #F0DFC8;background:#FFFBF5;border-radius:11px;font-size:14px;color:#B08D6E;font-weight:900;cursor:pointer}
/* toast */
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(14px);background:#7A5A3C;color:#FFF6E8;padding:11px 22px;border-radius:999px;font-size:13px;font-weight:800;z-index:200;opacity:0;pointer-events:none;transition:.3s;box-shadow:0 8px 22px rgba(90,70,54,.3)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* fly fx */
.flycup{position:fixed;z-index:150;font-size:30px;pointer-events:none;animation:fup 1.1s ease-out forwards}
@keyframes fup{0%{opacity:0;transform:translateY(10px) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translateY(-70px) scale(1.3)}}
/* history groups */
.dh{display:flex;align-items:baseline;gap:8px;margin:18px 0 4px}
.dh .dn2{font-size:13.5px;font-weight:900;color:#7A5A3C}
.dh .dc{font-size:11px;color:#C9A882;font-weight:800}
.dh .dline{flex:1;height:1px;background:#F0E4D0}
footer{margin-top:26px;text-align:center;font-size:11px;color:#CBB89E;font-weight:700;letter-spacing:.1em;line-height:2}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="en">SIP · SIP · SIP</div>
    <h1>今天<em>喝</em>了什么</h1>
    <div class="sub">每一杯都值得记下来 ☁️</div>
  </div>

  <div class="today">
    <div class="td" id="tdDate">—</div>
    <div class="num" id="tdNum">0<small>杯</small></div>
    <div class="cap" id="tdCap">今天的第一杯，想好喝什么了吗？</div>
  </div>

  <div class="card">
    <h2>记一杯</h2>
    <div class="dgrid" id="dgrid"></div>
    <div class="crow">
      <input id="inCustom" type="text" maxlength="20" placeholder="或者写个名字：三分糖茉莉奶绿">
      <button class="cadd" id="btnCustom">记下</button>
    </div>
    <div id="freqRow" style="margin-top:10px;display:none">
      <div style="font-size:11px;color:#C9A882;font-weight:900;letter-spacing:.12em;margin-bottom:6px">常 喝</div>
      <div class="dgrid" id="freqGrid" style="grid-template-columns:repeat(4,1fr);gap:8px;margin-top:0"></div>
    </div>
  </div>

  <div class="card">
    <h2>今日时间线</h2>
    <div class="tl" id="tl"></div>
  </div>

  <div class="stats">
    <div><div class="n" id="stMon">0</div><div class="l">本月杯数</div></div>
    <div><div class="n" id="stFav">—</div><div class="l">最常喝</div></div>
    <div><div class="n" id="stStreak">0<small style="font-size:12px">天</small></div><div class="l">连续记录</div></div>
  </div>

  <div class="card">
    <div class="calhead">
      <button id="calPrev">←</button>
      <div class="cm" id="calMon">—</div>
      <button id="calNext">→</button>
    </div>
    <div class="cal" id="cal"></div>
  </div>

  <div class="card">
    <h2>最近的日子</h2>
    <div id="hist"></div>
  </div>

  <footer>sip. 每一杯都算数<br>奶茶不是罪，是今天的糖 ☺</footer>
</div>

<div class="ovl" id="ovl">
  <div class="sheet">
    <h3 id="shT">编辑这一杯</h3>
    <div class="se" id="shE">🧋</div>
    <div class="sub2" id="shS"></div>
    <input id="shNote" type="text" maxlength="30" placeholder="加一句备注：三分糖 / 和同事拼的…">
    <div class="sbtns">
      <button class="b1" id="shDel">删掉这杯</button>
      <button class="b2" id="shSave">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const KINDS=[
 {k:'milk', e:'🧋', n:'奶茶'},
 {k:'cof',  e:'☕', n:'咖啡'},
 {k:'tea',  e:'🍵', n:'清茶'},
 {k:'fru',  e:'🧃', n:'果汁'},
 {k:'lem',  e:'🍋', n:'柠檬水'},
 {k:'soda', e:'🥤', n:'气泡水'},
 {k:'coc',  e:'🍫', n:'可可'},
 {k:'milk2',e:'🥛', n:'纯牛奶'},
];
const KEY='sip-cups-v1';
let G=JSON.parse(localStorage.getItem(KEY)||'{}');
G.log=G.log||{};
function save(){localStorage.setItem(KEY,JSON.stringify(G))}
function $id(x){return document.getElementById(x)}
function today(){return new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Shanghai'})}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function cups(d){return (G.log[d]||[])}
function allCups(){const a=[];Object.keys(G.log).sort().forEach(d=>G.log[d].forEach(c=>a.push({...c,d})));return a}
function toast(t){const e=$id('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1900)}
function nowHM(){const d=new Date();return d.toLocaleTimeString('sv-SE',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit'})}
function addCup(name,kind){
  const d=today();
  G.log[d]=G.log[d]||[];
  G.log[d].push({t:nowHM(),k:kind||'milk',n:name,m:''});
  save();
  const f=document.createElement('div');f.className='flycup';
  f.textContent=(KINDS.find(x=>x.k===(kind||'milk'))||KINDS[0]).e;
  f.style.left=(44+Math.random()*12)+'%';f.style.top='30%';
  document.body.appendChild(f);setTimeout(()=>f.remove(),1100);
  render();toast('记下了：'+name);
  $id('inCustom').value='';
}
/* ---------- render ---------- */
let calY,calM;
function render(){
  const t=today();
  $id('tdDate').textContent=new Date().toLocaleDateString('zh-CN',{timeZone:'Asia/Shanghai',month:'long',day:'numeric',weekday:'long'});
  const n=cups(t).length;
  $id('tdNum').innerHTML=n+'<small>杯</small>';
  $id('tdCap').innerHTML=n===0?'今天的第一杯，想好喝什么了吗？':n<3?'今天喝了 <b>'+n+'</b> 杯，刚刚好 ☺':'今天已经 <b>'+n+'</b> 杯啦，记得多喝温水 🫖';
  /* timeline */
  const list=cups(t);
  $id('tl').innerHTML=list.length?list.map((c,i)=>{
    const kd=KINDS.find(x=>x.k===c.k)||KINDS[0];
    return '<div class="trow" data-i="'+i+'"><div class="te">'+kd.e+'</div>'+
      '<div class="tt"><div class="tn">'+esc(c.n)+'</div>'+(c.m?'<div class="tm">「'+esc(c.m)+'」</div>':'')+'</div>'+
      '<div class="thw">'+c.t+'</div></div>';
  }).join(''):'<div class="empty">今天的杯子还空着<br>从上面挑一杯开始吧</div>';
  /* stats */
  const mon=t.slice(0,7);
  const all=allCups();
  $id('stMon').textContent=all.filter(c=>c.d.startsWith(mon)).length;
  const cnt={};
  all.forEach(c=>cnt[c.n]=(cnt[c.n]||0)+1);
  const fav=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  $id('stFav').textContent=fav?fav[0].slice(0,4):'—';
  /* streak */
  let s=0;const d=new Date();
  for(;;){
    const ds=d.toLocaleDateString('sv-SE',{timeZone:'Asia/Shanghai'});
    if(G.log[ds]&&G.log[ds].length){s++;d.setDate(d.getDate()-1);}
    else if(s===0&&ds===t){d.setDate(d.getDate()-1);continue;}
    else break;
  }
  $id('stStreak').innerHTML=s+'<small style="font-size:12px">天</small>';
  /* freq */
  const freq=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,4);
  $id('freqRow').style.display=freq.length?'block':'none';
  $id('freqGrid').innerHTML=freq.map(([nm,c])=>{
    const kd=KINDS.find(x=>x.n===nm)||KINDS[0];
    return '<button class="dbtn" data-fn="'+esc(nm)+'" data-fk="'+kd.k+'"><div class="de">'+kd.e+'</div><div class="dn">'+esc(nm.length>5?nm.slice(0,5)+'…':nm)+'</div></button>';
  }).join('');
  renderCal();renderHist();
}
function renderCal(){
  if(calY===undefined){const d=new Date();calY=d.getFullYear();calM=d.getMonth();}
  $id('calMon').textContent=calY+' 年 '+(calM+1)+' 月';
  const first=new Date(calY,calM,1).getDay();
  const days=new Date(calY,calM+1,0).getDate();
  let h=['日','一','二','三','四','五','六'].map(x=>'<div class="ch">'+x+'</div>').join('');
  for(let i=0;i<first;i++)h+='<div class="cd pad"></div>';
  const t=today();
  for(let i=1;i<=days;i++){
    const ds=calY+'-'+String(calM+1).padStart(2,'0')+'-'+String(i).padStart(2,'0');
    const c=cups(ds).length;
    h+='<div class="cd'+(ds===t?' today':'')+(c?' has':'')+'"><b>'+i+'</b><div class="dots">'+
      Array.from({length:Math.min(c,4)},()=>'<i></i>').join('')+(c>4?'<i style="background:#E8B08A"></i>':'')+'</div></div>';
  }
  $id('cal').innerHTML=h;
}
function renderHist(){
  const ds=Object.keys(G.log).filter(d=>G.log[d].length).sort().reverse().slice(0,7);
  $id('hist').innerHTML=ds.length?ds.map(d=>{
    const list=G.log[d];
    return '<div class="dh"><span class="dn2">'+d.slice(5).replace('-',' / ')+'</span><span class="dc">'+list.length+' 杯</span><div class="dline"></div></div>'+
      '<div class="tl">'+list.map(c=>{
        const kd=KINDS.find(x=>x.k===c.k)||KINDS[0];
        return '<div class="trow" data-d="'+d+'" data-n="'+esc(c.n)+'"><div class="te">'+kd.e+'</div>'+
          '<div class="tt"><div class="tn">'+esc(c.n)+'</div>'+(c.m?'<div class="tm">「'+esc(c.m)+'」</div>':'')+'</div>'+
          '<div class="thw">'+c.t+'</div></div>';
      }).join('')+'</div>';
  }).join(''):'<div class="empty">还没有记录，第一杯从今天开始</div>';
}
/* ---------- events ---------- */
$id('dgrid').innerHTML=KINDS.map(k=>'<button class="dbtn" data-k="'+k.k+'"><div class="de">'+k.e+'</div><div class="dn">'+k.n+'</div></button>').join('');
$id('dgrid').addEventListener('click',e=>{
  const b=e.target.closest('.dbtn');if(!b)return;
  addCup(KINDS.find(x=>x.k===b.dataset.k).n,b.dataset.k);
});
$id('btnCustom').addEventListener('click',()=>{
  const v=$id('inCustom').value.trim();
  if(!v){toast('写个名字，比如「茉莉奶绿」');return;}
  addCup(v,'milk');
});
$id('inCustom').addEventListener('keydown',e=>{if(e.key==='Enter')$id('btnCustom').click()});
$id('freqGrid').addEventListener('click',e=>{
  const b=e.target.closest('.dbtn');if(!b)return;
  addCup(b.dataset.fn,b.dataset.fk);
});
/* sheet */
let curEdit=null;
document.addEventListener('click',e=>{
  const r=e.target.closest('.trow');if(!r)return;
  let d,i;
  if(r.dataset.i!==undefined){d=today();i=+r.dataset.i;}
  else{d=r.dataset.d;i=G.log[d].findIndex(c=>c.n===r.dataset.n&&c.t===(r.querySelector('.thw')||{}).textContent);}
  if(!G.log[d]||!G.log[d][i])return;
  curEdit={d,i};
  const c=G.log[d][i];
  const kd=KINDS.find(x=>x.k===c.k)||KINDS[0];
  $id('shE').textContent=kd.e;
  $id('shS').textContent=c.n+' · '+d+' '+c.t;
  $id('shNote').value=c.m||'';
  $id('ovl').classList.add('open');
});
$id('shSave').addEventListener('click',()=>{
  if(curEdit){G.log[curEdit.d][curEdit.i].m=$id('shNote').value.trim();save();}
  $id('ovl').classList.remove('open');render();toast('已保存');
});
let delArm=false;
$id('shDel').addEventListener('click',()=>{
  if(!delArm){delArm=true;$id('shDel').textContent='再按一次确认删除';$id('shDel').style.background='#FDEEEA';setTimeout(()=>{delArm=false;$id('shDel').textContent='删掉这杯';$id('shDel').style.background='#fff'},2500);return;}
  if(curEdit){G.log[curEdit.d].splice(curEdit.i,1);if(!G.log[curEdit.d].length)delete G.log[curEdit.d];save();}
  delArm=false;$id('shDel').textContent='删掉这杯';$id('shDel').style.background='#fff';
  $id('ovl').classList.remove('open');render();toast('删掉了这一杯');
});
$id('ovl').addEventListener('click',e=>{if(e.target.id==='ovl')$id('ovl').classList.remove('open')});
/* calendar nav */
$id('calPrev').addEventListener('click',()=>{calM--;if(calM<0){calM=11;calY--;}renderCal()});
$id('calNext').addEventListener('click',()=>{calM++;if(calM>11){calM=0;calY++;}renderCal()});
render();
</script>
</body>
</html>
